<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TODO App</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 40px 20px;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
      background: white;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      overflow: hidden;
    }

    header {
      background: #667eea;
      color: white;
      padding: 30px;
      text-align: center;
    }

    header h1 {
      font-size: 28px;
      font-weight: 600;
    }

    .input-section {
      padding: 20px;
      border-bottom: 1px solid #eee;
    }

    .input-group {
      display: flex;
      gap: 10px;
    }

    #todo-input {
      flex: 1;
      padding: 12px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 16px;
      transition: border-color 0.2s;
    }

    #todo-input:focus {
      outline: none;
      border-color: #667eea;
    }

    #add-btn {
      padding: 12px 24px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.2s;
    }

    #add-btn:hover {
      background: #5a6fd6;
    }

    .todo-list {
      list-style: none;
      max-height: 400px;
      overflow-y: auto;
    }

    .todo-item {
      display: flex;
      align-items: center;
      padding: 16px 20px;
      border-bottom: 1px solid #f0f0f0;
      transition: background 0.2s;
    }

    .todo-item:hover {
      background: #f9f9f9;
    }

    .todo-item.completed .todo-text {
      text-decoration: line-through;
      color: #999;
    }

    .todo-checkbox {
      width: 22px;
      height: 22px;
      margin-right: 14px;
      cursor: pointer;
      accent-color: #667eea;
    }

    .todo-text {
      flex: 1;
      font-size: 16px;
      color: #333;
    }

    .delete-btn {
      background: none;
      border: none;
      color: #ccc;
      font-size: 20px;
      cursor: pointer;
      padding: 4px 8px;
      transition: color 0.2s;
    }

    .delete-btn:hover {
      color: #e74c3c;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #999;
    }

    .stats {
      padding: 16px 20px;
      background: #f8f9fa;
      color: #666;
      font-size: 14px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>TODO App</h1>
    </header>

    <div class="input-section">
      <div class="input-group">
        <input type="text" id="todo-input" placeholder="新しいタスクを入力...">
        <button id="add-btn">追加</button>
      </div>
    </div>

    <ul class="todo-list" id="todo-list"></ul>

    <div class="stats" id="stats"></div>
  </div>

  <script>
    const todoInput = document.getElementById('todo-input');
    const addBtn = document.getElementById('add-btn');
    const todoList = document.getElementById('todo-list');
    const stats = document.getElementById('stats');

    let todos = JSON.parse(localStorage.getItem('todos')) || [];

    function saveTodos() {
      localStorage.setItem('todos', JSON.stringify(todos));
    }

    function renderTodos() {
      if (todos.length === 0) {
        todoList.innerHTML = '<li class="empty-state">タスクがありません</li>';
        stats.textContent = '';
        return;
      }

      todoList.innerHTML = todos.map((todo, index) => `
        <li class="todo-item ${todo.completed ? 'completed' : ''}" data-index="${index}">
          <input type="checkbox" class="todo-checkbox" ${todo.completed ? 'checked' : ''}>
          <span class="todo-text">${escapeHtml(todo.text)}</span>
          <button class="delete-btn">&times;</button>
        </li>
      `).join('');

      const completed = todos.filter(t => t.completed).length;
      stats.textContent = `${completed} / ${todos.length} 完了`;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function addTodo() {
      const text = todoInput.value.trim();
      if (!text) return;

      todos.push({ text, completed: false });
      saveTodos();
      renderTodos();
      todoInput.value = '';
      todoInput.focus();
    }

    function toggleTodo(index) {
      todos[index].completed = !todos[index].completed;
      saveTodos();
      renderTodos();
    }

    function deleteTodo(index) {
      todos.splice(index, 1);
      saveTodos();
      renderTodos();
    }

    addBtn.addEventListener('click', addTodo);

    todoInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') addTodo();
    });

    todoList.addEventListener('click', (e) => {
      const item = e.target.closest('.todo-item');
      if (!item) return;

      const index = parseInt(item.dataset.index);

      if (e.target.classList.contains('todo-checkbox')) {
        toggleTodo(index);
      } else if (e.target.classList.contains('delete-btn')) {
        deleteTodo(index);
      }
    });

    renderTodos();
  </script>
</body>
</html>
